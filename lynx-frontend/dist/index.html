<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYNX</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #141414;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --text-secondary: #888;
            --accent: #10b981;
            --error: #ff6b6b;
            --warning: #ffb74d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
        .header-info { display: flex; align-items: center; gap: 12px; }
        .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .status-badge.processed { background: #10b98122; color: var(--accent); }
        .status-badge.queued { background: #ffb74d22; color: var(--warning); }
        .status-badge.failed { background: #ff6b6b22; color: var(--error); }
        
        .main { display: flex; height: calc(100vh - 50px); }
        .sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 16px; background: var(--bg); font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .model-list { flex: 1; overflow-y: auto; }
        .model-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); }
        .model-item:hover { background: var(--bg); }
        .model-item.active { background: var(--bg); border-left: 3px solid var(--accent); }
        .model-item-title { font-size: 14px; margin-bottom: 4px; }
        .model-item-meta { font-size: 11px; color: var(--text-secondary); }
        .viewer-container { flex: 1; display: flex; flex-direction: column; }
        #viewer { flex: 1; background: #1a1a1a; position: relative; overflow: hidden; }
        #viewer-container { width: 100%; height: 100%; }
        .viewer-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; text-align: center; z-index: 10; }
        .right-panel { width: 350px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .panel-section { border-bottom: 1px solid var(--border); }
        .panel-header { padding: 10px 16px; background: var(--bg); font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--text-secondary); }
        .inspector-content { padding: 12px 16px; font-size: 13px; }
        .inspector-row { display: flex; margin-bottom: 8px; }
        .inspector-label { width: 80px; color: var(--text-secondary); flex-shrink: 0; }
        .inspector-value { flex: 1; word-break: break-word; }
        .issues-list { flex: 1; overflow-y: auto; padding: 8px; max-height: 400px; }
        .issue-item { padding: 10px 12px; margin-bottom: 8px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
        .issue-item:hover { background: var(--bg); }
        .issue-item.error { border-left: 3px solid var(--error); }
        .issue-item.warning { border-left: 3px solid var(--warning); }
        .issue-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .issue-badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
        .issue-badge.error { background: #ffebee; color: var(--error); }
        .issue-badge.warning { background: #fff3e0; color: var(--warning); }
        .issue-key { font-size: 12px; color: var(--text-secondary); }
        .issue-message { font-size: 13px; }
        .empty-state { padding: 40px 20px; text-align: center; color: var(--text-secondary); }
    </style>
  <script type="module" crossorigin src="/assets/index-CInFJVtX.js"></script>
</head>
<body>
    <div class="header">
        <h1>LYNX</h1>
        <div class="header-info">
            <span id="modelName">-</span>
            <span class="status-badge" id="modelStatus">-</span>
        </div>
    </div>
    
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header">Модели</div>
            <div class="model-list" id="modelList"><div class="empty-state">Загрузка...</div></div>
        </div>
        
        <div class="viewer-container">
            <div id="viewer">
                <div id="viewer-container"></div>
                <div class="viewer-placeholder" id="viewerPlaceholder">Загрузка 3D...</div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="panel-section">
                <div class="panel-header">Инспектор</div>
                <div class="inspector-content" id="inspector"><div class="empty-state">Выберите элемент</div></div>
            </div>
            <div class="panel-section" style="flex:1; display:flex; flex-direction:column;">
                <div class="panel-header">Ошибки</div>
                <div class="issues-list" id="issuesList"><div class="empty-state">Нет данных</div></div>
            </div>
        </div>
    </div>

</body>
</html>
