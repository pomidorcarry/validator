<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lynx - BIM Валидация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1a73e8;
            --bg: #f5f5f5;
            --panel: #ffffff;
            --border: #e0e0e0;
            --text: #333;
            --text-secondary: #666;
            --error: #d32f2f;
            --warning: #f57c00;
            --success: #388e3c;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            background: var(--primary);
            color: white;
        }
        
        .status-badge.processed { background: var(--success); }
        .status-badge.failed { background: var(--error); }
        .status-badge.queued { background: var(--warning); }
        
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .sidebar {
            width: 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        .model-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .model-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        
        .model-item:hover {
            background: var(--bg);
        }
        
        .model-item.active {
            background: #e3f2fd;
            border-color: var(--primary);
        }
        
        .model-item-title {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .model-item-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .viewer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        #viewer {
            flex: 1;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
        
        .viewer-placeholder {
            text-align: center;
        }
        
        .right-panel {
            width: 350px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .panel-section {
            border-bottom: 1px solid var(--border);
        }
        
        .panel-header {
            padding: 10px 16px;
            background: var(--bg);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        
        .inspector-content {
            padding: 12px 16px;
            font-size: 13px;
        }
        
        .inspector-row {
            display: flex;
            margin-bottom: 8px;
        }
        
        .inspector-label {
            width: 80px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        
        .inspector-value {
            flex: 1;
            word-break: break-word;
        }
        
        .issues-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .issue-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        
        .issue-item:hover {
            background: var(--bg);
        }
        
        .issue-item.error {
            border-left: 3px solid var(--error);
        }
        
        .issue-item.warning {
            border-left: 3px solid var(--warning);
        }
        
        .issue-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .issue-badge {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .issue-badge.error { background: #ffebee; color: var(--error); }
        .issue-badge.warning { background: #fff3e0; color: var(--warning); }
        
        .issue-key {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .issue-message {
            font-size: 13px;
        }
        
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LYNX</h1>
        <div class="header-info">
            <span id="modelName">-</span>
            <span class="status-badge" id="modelStatus">-</span>
        </div>
    </div>
    
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header">Модели</div>
            <div class="model-list" id="modelList">
                <div class="empty-state">Загрузка...</div>
            </div>
        </div>
        
        <div class="viewer-container">
            <div id="viewer">
            <div class="viewer-placeholder">
                <div>3D viewer загружается...</div>
                <div style="font-size:12px; margin-top:8px;">XKT конвертация в разработке</div>
            </div>
        </div>
        </div>
        
        <div class="right-panel">
            <div class="panel-section">
                <div class="panel-header">Инспектор элемента</div>
                <div class="inspector-content" id="inspector">
                    <div class="empty-state">Выберите элемент</div>
                </div>
            </div>
            
            <div class="panel-section" style="flex:1; display:flex; flex-direction:column;">
                <div class="panel-header">Ошибки и предупреждения</div>
                <div class="issues-list" id="issuesList">
                    <div class="empty-state">Нет данных</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk@1.4.0/dist/xeokit-browser.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        let xeokitViewer = null;
        let selectedModelId = null;
        let models = [];
        
        async function loadModels() {
            try {
                const resp = await fetch(`${API_BASE}/models`);
                const data = await resp.json();
                models = data.models || [];
                renderModelList();
                
                if (models.length > 0 && !selectedModelId) {
                    selectModel(models[0].id);
                }
            } catch (e) {
                document.getElementById('modelList').innerHTML = 
                    '<div class="empty-state">Ошибка загрузки</div>';
            }
        }
        
        function renderModelList() {
            const container = document.getElementById('modelList');
            if (models.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет моделей</div>';
                return;
            }
            
            container.innerHTML = models.map(m => `
                <div class="model-item ${m.id === selectedModelId ? 'active' : ''}" 
                     onclick="selectModel('${m.id}')">
                    <div class="model-item-title">${m.model_name}</div>
                    <div class="model-item-meta">
                        ${formatDate(m.created_at)} · ${getStatusBadge(m.status)}
                    </div>
                </div>
            `).join('');
        }
        
        async function selectModel(id) {
            selectedModelId = id;
            renderModelList();
            
            const model = models.find(m => m.id === id);
            document.getElementById('modelName').textContent = model?.model_name || '-';
            document.getElementById('modelStatus').textContent = model?.status || '-';
            document.getElementById('modelStatus').className = 
                'status-badge ' + (model?.status || '');
            
            await loadIssues(id);
            await loadElements(id);
        }
        
        async function loadIssues(modelId) {
            try {
                const resp = await fetch(`${API_BASE}/models/${modelId}/issues`);
                const data = await resp.json();
                renderIssues(data.issues || []);
            } catch (e) {
                document.getElementById('issuesList').innerHTML = 
                    '<div class="empty-state">Ошибка загрузки</div>';
            }
        }
        
        function renderIssues(issues) {
            const container = document.getElementById('issuesList');
            if (issues.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет ошибок</div>';
                return;
            }
            
            container.innerHTML = issues.map(i => `
                <div class="issue-item ${i.severity}" onclick="highlightElement('${i.global_id}')">
                    <div class="issue-header">
                        <span class="issue-badge ${i.severity}">${i.severity}</span>
                        <span class="issue-key">${i.rule_key}</span>
                    </div>
                    <div class="issue-message">${i.message}</div>
                </div>
            `).join('');
        }
        
        let elements = [];
        
        async function loadElements(modelId) {
            try {
                const resp = await fetch(`${API_BASE}/models/${modelId}/elements`);
                const data = await resp.json();
                elements = data.elements || [];
            } catch (e) {
                elements = [];
            }
        }
        
        function showInspector(globalId) {
            const el = elements.find(e => e.global_id === globalId);
            const container = document.getElementById('inspector');
            
            if (!el) {
                container.innerHTML = '<div class="empty-state">Элемент не найден</div>';
                return;
            }
            
            const norm = el.normalized_jsonb || {};
            
            container.innerHTML = `
                <div class="inspector-row">
                    <span class="inspector-label">Класс:</span>
                    <span class="inspector-value">${el.ifc_class}</span>
                </div>
                <div class="inspector-row">
                    <span class="inspector-label">Имя:</span>
                    <span class="inspector-value">${el.name || '-'}</span>
                </div>
                <div class="inspector-row">
                    <span class="inspector-label">Система:</span>
                    <span class="inspector-value">${el.system_name || '-'}</span>
                </div>
                <div class="inspector-row">
                    <span class="inspector-label">Этаж:</span>
                    <span class="inspector-value">${el.storey_name || '-'}</span>
                </div>
                <div class="inspector-row">
                    <span class="inspector-label">Диаметр:</span>
                    <span class="inspector-value">${norm.diameter_mm ? norm.diameter_mm + ' мм' : '-'}</span>
                </div>
            `;
        }
        
        function highlightElement(globalId) {
            showInspector(globalId);
            
            if (xeokitViewer && xeokitViewer.scene) {
                const objectId = globalId;
                console.log('Highlight:', objectId);
            }
        }
        
        function getStatusBadge(status) {
            const map = {
                'queued': 'В очереди',
                'processing': 'Обработка',
                'processed': 'Готово',
                'failed': 'Ошибка'
            };
            return map[status] || status;
        }
        
        function formatDate(iso) {
            if (!iso) return '-';
            return new Date(iso).toLocaleString('ru');
        }
        
        function initViewer() {
            try {
                const viewerDiv = document.getElementById('viewer');
                xeokitViewer = new xeokit.XeokitViewer(viewerDiv, {
                    backgroundColor: [0.1, 0.1, 0.1, 1]
                });
                
                xeokitViewer.scene.on('click', (e) => {
                    if (e.entity && e.entity.metaObject) {
                        const globalId = e.entity.metaObject.getProperty('globalId');
                        if (globalId) {
                            showInspector(globalId);
                        }
                    }
                });
            } catch (e) {
                console.error('Viewer init error:', e);
            }
        }
        
        initViewer();
        loadModels();
        
        setInterval(loadModels, 10000);
    </script>
</body>
</html>
